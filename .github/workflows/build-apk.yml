name: Build Domino APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK
        run: |
          mkdir -p /tmp/domino-app/www
          if [ -f "www/index.html" ]; then
            cp -r www/* /tmp/domino-app/www/
          elif [ -f "domino/index.html" ]; then
            cp -r domino/* /tmp/domino-app/www/
          elif [ -f "index.html" ]; then
            cp index.html /tmp/domino-app/www/
          else
            echo "Error: index.html not found!"
            exit 1
          fi

          cd /tmp/domino-app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Domino" "io.github.castapp9.domino" --web-dir www
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Domino-APK
          path: app-debug.apk
